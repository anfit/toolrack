name: Unit tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.14"]
        click-spec: [""]
        include:
          # Oldest supported Click: the completion and --help fast paths must
          # match its output byte for byte too.
          - os: ubuntu-latest
            python-version: "3.11"
            click-spec: "click==8.1.8"
          - os: windows-latest
            python-version: "3.11"
            click-spec: "click==8.1.8"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -e ".[dev]" ${{ matrix.click-spec }}

      - name: Run unit tests
        run: python -m pytest
