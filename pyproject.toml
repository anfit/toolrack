[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "toolrack-cli"  # PyPI distribution name; the import package and command remain "toolrack".
dynamic = ["version"]
description = "Turn a folder of small scripts plus YAML sidecars into one typed, completable CLI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jan Chimiak" }]
keywords = ["cli", "scripts", "click", "dispatcher", "shell-completion"]
requires-python = ">=3.11"
dependencies = [
    # Upper bound: the completion and --help fast paths reproduce Click's output
    # byte for byte, so a new Click minor is adopted only after the parity tests pass.
    "click>=8.1,<8.4",
    "pyyaml>=6.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities",
]

[project.urls]
Repository = "https://github.com/anfit/toolrack"
Template = "https://github.com/anfit/toolrack-template"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
toolrack = "toolrack.entrypoint:main"

# Fixtures for testing your own scripts repo; inert unless a test requests them.
[project.entry-points.pytest11]
toolrack = "toolrack.pytest_plugin"

[tool.setuptools.dynamic]
version = { attr = "toolrack.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m \"not integration\""
markers = [
    "integration: slow end-to-end tests (deselect with '-m not integration')",
]
